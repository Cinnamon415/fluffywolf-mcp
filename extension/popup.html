<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FluffyWolf MCP</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img id="logo" src="icons/icon-locked.svg" alt="" width="28" height="28">
    <h1>FluffyWolf MCP</h1>
    <button id="theme" class="icon-btn" type="button" data-mode="auto" title="Тема: как в системе" aria-label="Переключить тему">
      <svg class="i-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
      <svg class="i-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <span id="pill" class="pill">Закрыт</span>
  </header>

  <button id="plank" class="plank" type="button" aria-expanded="false" aria-controls="picker">
    <span class="plank-text">
      <span id="plank-title" class="plank-title">Доступ никому не выдан</span>
      <span id="plank-sub" class="plank-sub">Нажмите, чтобы выбрать сессию</span>
    </span>
    <span id="plank-count" class="count" hidden>0</span>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <div id="picker" class="picker" hidden></div>

  <div id="bound" hidden>
    <section class="timer-card">
      <div id="clock" class="clock">—</div>
      <div id="clock-label" class="clock-label">Доступ закрыт</div>
      <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
      <div id="link" class="link"></div>
    </section>

    <div class="actions">
      <button id="main" class="btn primary" type="button">Разрешить доступ</button>
      <button id="revoke" class="btn ghost" type="button" hidden>Отозвать</button>
    </div>
    <p id="hint" class="hint"></p>

    <section class="perm-card">
      <h2>Разрешения агента</h2>
      <label class="perm"><input id="r-newTabs" type="checkbox"><span><b>Открывать новые вкладки</b><small>Свои вкладки агент может закрывать сам.</small></span></label>
      <label class="perm"><input id="r-crossDomain" type="checkbox"><span><b>Переходить на другие сайты</b><small>С разрешённой вкладки, например по ссылкам.</small></span></label>
      <label class="perm"><input id="r-full" type="checkbox"><span><b>Полный доступ</b><small>Все вкладки окна без ограничений. Остальные галочки отключаются.</small></span></label>
      <div id="tabs-block">
        <div id="tabs-title" class="field-label">Разрешённые вкладки</div>
        <ul id="tabs" class="tabs"></ul>
        <p id="tabs-hint" class="hint">Разрешайте вкладки кнопкой в адресной строке.</p>
      </div>
    </section>

    <button id="unbind" class="link-btn" type="button">Отвязать агента от этого окна</button>
  </div>

  <hr>

  <label class="field-label" for="once">Разово, минут</label>
  <div class="row">
    <input id="once" type="number" inputmode="numeric" min="1" max="1440" step="1" placeholder="например, 5">
    <button id="apply" class="btn" type="button">Применить</button>
  </div>

  <label class="field-label" for="default">По умолчанию, минут</label>
  <div class="row">
    <input id="default" type="number" inputmode="numeric" min="1" max="1440" step="1">
    <button id="save" class="btn" type="button">Сохранить</button>
  </div>

  <label class="field-label" for="profile">Имя этого профиля (его видит агент)</label>
  <div class="row">
    <input id="profile" type="text" maxlength="40" autocomplete="off">
    <button id="save-profile" class="btn" type="button">Сохранить</button>
  </div>

  <p id="error" class="error" role="alert" hidden></p>
  <script src="popup.js"></script>
</body>
</html>
